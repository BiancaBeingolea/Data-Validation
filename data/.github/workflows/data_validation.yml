name: Data Quality Checks

# Triggers: Run when code or data is pushed, or when a PR is opened against 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-data:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code into the GitHub runner environment
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Set up Python in the runner environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install required libraries
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run the data validation script
    - name: Run Data Validation Checks
      run: |
        python validate_data.py